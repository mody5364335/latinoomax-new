  <style>
@import url("https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap");
:root {
  font-family: "Cairo", Tahoma, Arial, sans-serif;
  color: #153f35;
  background: #f7f6ef;
  font-synthesis: none;
  --green: #123f35;
  --orange: #ef825c;
  --line: #dddfd3;
  --mint: #e8eddf;
  --muted: #717b6d;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  line-height: 1.65;
}
button,
input,
textarea,
select,
a {
  font: inherit;
}
button,
a {
  touch-action: manipulation;
}
button {
  cursor: pointer;
  border: 0;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}
a {
  color: inherit;
  text-decoration: none;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid var(--orange);
  outline-offset: 3px;
}
header {
  max-width: 1360px;
  margin: auto;
  padding: 22px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  gap: 15px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand b {
  font: 900 19px Arial;
  letter-spacing: 1px;
}
.brand small {
  display: block;
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px;
}
.logo {
  font: 900 36px Georgia;
  color: #fff;
  background: var(--green);
  padding: 5px 12px;
  border-radius: 12px;
  direction: ltr;
}
.logo span {
  color: var(--orange);
  font: 22px Arial;
  margin-left: 2px;
}
.primary,
.secondary,
.accent {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 11px 19px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 13px;
  line-height: 1.7;
}
.primary {
  background: var(--green);
  color: white;
}
.secondary {
  background: var(--mint);
  color: var(--green);
}
.accent {
  background: var(--orange);
  color: #173e31;
}
.bubble {
  background: var(--orange);
  color: var(--green);
  padding: 0 9px;
  border-radius: 30px;
}
.eyebrow {
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.3px;
  margin: 0 0 5px;
}
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 20px;
}
.section-head h2 {
  font-size: 26px;
  line-height: 1.5;
  margin: 0;
}
.muted {
  color: var(--muted);
  font-size: 12px;
}
main {
  max-width: 1280px;
  margin: auto;
  padding: 0 28px;
}
.featured {
  margin-top: 30px;
}
.feature-track {
  display: flex;
  overflow: auto;
  gap: 16px;
  padding-bottom: 12px;
  scroll-snap-type: x mandatory;
  scrollbar-width: thin;
}
.feature-card {
  display: flex;
  text-align: right;
  align-items: stretch;
  background: #fffefa;
  border: 1px solid var(--line);
  min-width: 345px;
  width: calc((100% - 32px) / 3);
  flex-shrink: 0;
  border-radius: 16px;
  overflow: hidden;
  color: var(--green);
  padding: 0;
  scroll-snap-align: start;
  transition: transform 0.2s;
}
.feature-card:hover {
  transform: translateY(-3px);
}
.feature-card img,
.feature-card > .placeholder {
  width: 115px;
  min-height: 150px;
  object-fit: cover;
  flex-shrink: 0;
}
.feature-copy {
  padding: 15px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 7px;
}
.feature-copy small {
  font-size: 9px;
  align-self: start;
  background: #fbe4d4;
  border-radius: 20px;
  padding: 2px 10px;
}
.feature-copy b {
  font-size: 14px;
  line-height: 1.7;
}
.feature-copy > span {
  font-size: 12px;
  font-weight: 800;
}
.feature-copy i {
